name: Android verification

on:
  push:
    branches:
      - feat/a3-local-android-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch to verify (the Android MVP implementation branch)
        required: true
        type: choice
        default: feat/a3-local-android-mvp
        options:
          - feat/a3-local-android-mvp

permissions:
  contents: read

concurrency:
  group: android-verification-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: JVM tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aki-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  responsive-emulators:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: unit-and-build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: compact
            label: Compact phone emulator
            profile: 5.4in FWVGA
          - kind: foldable
            label: Foldable emulator postures
            profile: 7.6in Foldable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 build platform and API 34 emulator
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-34;default;x86_64"

      - name: Verify compact phone layout
        if: matrix.kind == 'compact'
        run: |
          set -euo pipefail
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n test --package 'system-images;android-34;default;x86_64' --device '5.4in FWVGA'
          adb start-server
          echo "Launching AVD; emulator binary: $ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel off > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          echo "Waiting up to five minutes for ADB device discovery."
          timeout 300 adb -s emulator-5554 wait-for-device

          booted=0
          for attempt in $(seq 1 450); do
            state="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "1" ]; then booted=1; break; fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "Emulator did not complete boot within 15 minutes."
            tail -n 120 "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi

          package_ready=0
          for attempt in $(seq 1 60); do
            if adb -s emulator-5554 shell pm path android >/dev/null 2>&1; then package_ready=1; break; fi
            sleep 2
          done
          if [ "$package_ready" -ne 1 ]; then
            echo "Android package manager did not become ready."
            tail -n 120 "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi

          adb -s emulator-5554 shell pm path android
          ANDROID_SERIAL=emulator-5554 gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedWidthClass=compact

      - name: Verify foldable open, half-open and folded postures
        if: matrix.kind == 'foldable'
        run: |
          set -euo pipefail
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n test --package 'system-images;android-34;default;x86_64' --device '7.6in Foldable'
          adb start-server
          echo "Launching AVD; emulator binary: $ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel off > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          echo "Waiting up to five minutes for ADB device discovery."
          timeout 300 adb -s emulator-5554 wait-for-device

          booted=0
          for attempt in $(seq 1 450); do
            state="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "1" ]; then booted=1; break; fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "Foldable emulator did not complete boot within 15 minutes."
            tail -n 120 "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi

          package_ready=0
          for attempt in $(seq 1 60); do
            if adb -s emulator-5554 shell pm path android >/dev/null 2>&1; then package_ready=1; break; fi
            sleep 2
          done
          if [ "$package_ready" -ne 1 ]; then
            echo "Android package manager did not become ready on foldable emulator."
            tail -n 120 "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi

          adb -s emulator-5554 shell pm path android
          adb -s emulator-5554 emu unfold
          sleep 3
          ANDROID_SERIAL=emulator-5554 gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedWidthClass=medium

          states="$(adb -s emulator-5554 shell cmd device_state print-states)"
          echo "$states"
          half_open_id="$(echo "$states" | grep -oE "identifier=[0-9]+, name='(HALF_OPENED|HALF_FOLDED|TENT)'" | head -n 1 | cut -d= -f2 | cut -d, -f1)"
          if [ -z "$half_open_id" ]; then
            echo "Foldable emulator does not expose a half-open device state."
            exit 1
          fi
          adb -s emulator-5554 shell cmd device_state state "$half_open_id"
          sleep 3
          ANDROID_SERIAL=emulator-5554 gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedWidthClass=medium -Pandroid.testInstrumentationRunnerArguments.expectFoldingFeature=true

          adb -s emulator-5554 emu fold
          sleep 3
          ANDROID_SERIAL=emulator-5554 gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedWidthClass=compact

      - name: Capture emulator diagnostics
        if: always()
        run: |
          timeout 15 adb devices -l > "$RUNNER_TEMP/adb-devices.txt" 2>&1 || true
          timeout 15 adb -s emulator-5554 logcat -d -t 3000 > "$RUNNER_TEMP/emulator-logcat.txt" 2>&1 || true
          timeout 15 adb -s emulator-5554 emu kill || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/emulator-logcat.txt
            ${{ runner.temp }}/adb-devices.txt
          if-no-files-found: ignore
