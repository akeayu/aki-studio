name: Android verification

on:
  push:
    branches:
      - feat/a3-local-android-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch to verify (the Android MVP implementation branch)
        required: true
        type: choice
        default: feat/a3-local-android-mvp
        options:
          - feat/a3-local-android-mvp

permissions:
  contents: read

concurrency:
  group: android-verification-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: JVM tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aki-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  responsive-emulators:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: unit-and-build
    timeout-minutes: 45
    env:
      # GitHub-hosted Linux runners do not expose KVM; explicitly permit the
      # Android Emulator's TCG software CPU backend instead of failing at boot.
      ANDROID_I_WANT_MY_TCG: "yes"
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: compact
            label: Compact phone emulator
            profile: 5.4in FWVGA
          - kind: foldable
            label: Foldable emulator postures
            profile: 7.6in Foldable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify compact phone layout
        if: matrix.kind == 'compact'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          # swiftshader_indirect is deprecated in current emulator releases; use the supported
          # SwiftShader renderer to avoid color-buffer failures on software-rendered CI runners.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          # The runner's post-boot settings writes intermittently lose ADB on TCG hosts.
          # Leave system animations enabled rather than failing before instrumentation starts.
          disable-animations: false
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedWidthClass=compact

      - name: Verify foldable open, half-open and folded postures
        if: matrix.kind == 'foldable'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          # swiftshader_indirect is deprecated in current emulator releases; use the supported
          # SwiftShader renderer to avoid color-buffer failures on software-rendered CI runners.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          # The runner's post-boot settings writes intermittently lose ADB on TCG hosts.
          # Leave system animations enabled rather than failing before instrumentation starts.
          disable-animations: false
          script: |
            set -euo pipefail
            adb emu unfold
            sleep 3
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedWidthClass=medium

            states="$(adb shell cmd device_state print-states)"
            echo "$states"
            half_open_id="$(echo "$states" | grep -oE "identifier=[0-9]+, name='(HALF_OPENED|HALF_FOLDED|TENT)'" | head -n 1 | cut -d= -f2 | cut -d, -f1)"
            if [ -z "$half_open_id" ]; then
              echo "Foldable emulator does not expose a half-open device state."
              exit 1
            fi
            adb shell cmd device_state state "$half_open_id"
            sleep 3
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedWidthClass=medium -Pandroid.testInstrumentationRunnerArguments.expectFoldingFeature=true

            adb emu fold
            sleep 3
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedWidthClass=compact
